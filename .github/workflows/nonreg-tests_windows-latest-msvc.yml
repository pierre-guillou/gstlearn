name: nonreg-tests_windows-latest-msvc

on:
  # Permit calling trigger
  workflow_call:
  # Activate the workflow at each push on dev branch
  #push:
  #  branches: [ dev ]
  # Activate the workflow at each pull request on dev branch
  #pull_request:
  #  branches: [ dev ]
  # Permit manual trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Manual'
        required: false
        default: ''

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  CMAKE_BUILD_TYPE : Release
  BUILD_DIR : build
  CMAKE_GENERATOR : Ninja
  PYTHON_VERSION : "3.14"
  GSTLEARN_OUTPUT_DIR: ${{ github.workspace }}\build\gstlearn_dir
  CMAKE_TOOLCHAIN_FILE : C:\vcpkg\scripts\buildsystems\vcpkg.cmake

jobs:

  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        run-install: false

    - name: Install dependencies
      run: |
        pixi init
        pixi add libboost-headers `
                 eigen `
                 nlopt `
                 gdal `
                 ninja `
                 python==${{env.PYTHON_VERSION}}
        pixi add --pypi numpy mlxtend uv

    - name: Build & install HDF5 static libraries
      uses: ./.github/actions/hdf5_static_windows
      env:
        CMAKE_GENERATOR: "Visual Studio 17 2022"

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2

    - name: Configure build directory
      run: |
        cmake \
          -B${{ env.BUILD_DIR }} \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -DBoost_INCLUDE_DIR=$CONDA_PREFIX/Library/include \
          -DHDF5_USE_STATIC_LIBRARIES=ON \
          -DBUILD_TESTING=ON \
          -DBUILD_PYTHON=ON
      env:
        SCCACHE_GHA_ENABLED: "true"
        CMAKE_CC_COMPILER_LAUNCHER: sccache
        CMAKE_CXX_COMPILER_LAUNCHER: sccache
      shell: pixi run bash -e {0}

    - name: Build the package
      run: |
        cmake --build ${{env.BUILD_DIR}} --parallel 3

    - name: Install packages and execute non-regression tests
      run: |
        export GDAL_VERSION=$(pixi list | grep gdal | head -n 1 | awk '{print $2}')
        export GDAL_INCLUDE_PATH=$CONDA_PREFIX/Library/include
        export GDAL_LIBRARY_PATH=$CONDA_PREFIX/Library/lib
        cmake --build ${{env.BUILD_DIR}} --target check
      shell: pixi run bash -e {0}

    - name: Compress output logs and neutral files
      if: success() || failure()
      shell: bash
      run: |
        cd ${{env.BUILD_DIR}}/tests
        find . -type f -name "*.out" -print0 | tar -czvf msvc-logs.tar.gz --null -T -
        cd $GITHUB_WORKSPACE/build/gstlearn_dir
        find . -type f -name "*.*" -print0 | tar -czvf msvc-neutral.tar.gz --null -T -
        mv msvc-neutral.tar.gz $GITHUB_WORKSPACE/

    - name: Publish output logs as artefact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: msvc-nonreg-logs
        path: ${{env.BUILD_DIR}}/tests/msvc-logs.tar.gz

    - name: Publish output neutral files as artefact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: msvc-neutral-files
        path: ${{github.workspace}}/msvc-neutral.tar.gz
