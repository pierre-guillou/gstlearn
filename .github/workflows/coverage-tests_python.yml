name: coverage-tests_python

on:
  push:
    branches: [macos_llvm]
  # Permit calling trigger
  workflow_call:
  # Permit manual trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Manual'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # Double quote for version is needed otherwise 3.10 => 3.1
        python: ["3.11"]
        # See the list here: https://github.com/actions/runner-images#available-images
        os: [macos-13, macos-14, macos-15]
        exclude:
          - os: macos-14
            python: "3.9"
          - os: macos-15
            python: "3.9"
          
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        brew install libomp
        brew list libomp
        echo "DYLD_LIBRARY_PATH=/usr/local/opt/libomp/lib" >> "$GITHUB_ENV"
      shell: bash

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{matrix.python}}

    - name: Install gstlearn
      run: |
        python -m pip install --upgrade pip
        python -m pip install gstlearn[conv]

    - name: Run the python tests
      run: |
        python tests/py/test_Arguments.py
        python tests/py/test_Assessors.py
        python tests/py/test_Matrix.py
        python tests/py/test_h5.py
